name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/mathqclj/public_html
            backup_dir="/home/mathqclj/backups/admin-security-$(date -u +%Y%m%dT%H%M%SZ)"
            mkdir -p "$backup_dir"
            tar -czf "$backup_dir/files.tgz" .htaccess index.php __init.php connection/config.php inc views/admin views/public/payment views/public/requests views/user/requests
            if [ -f .env ]; then
              set -a
              . ./.env
              set +a
            fi
            DB_HOST="${DB_HOST:-127.0.0.1}"
            DB_NAME="${DB_NAME:-mathmsgv_lms}"
            DB_USER="${DB_USER:-root}"
            DB_PASS="${DB_PASS:-}"
            if command -v mysqldump >/dev/null 2>&1; then
              dump_defaults="$(mktemp)"
              chmod 600 "$dump_defaults"
              printf '[client]\nhost=%s\nuser=%s\npassword=%s\n' "$DB_HOST" "$DB_USER" "$DB_PASS" > "$dump_defaults"
              table_list="$(mysql --defaults-extra-file="$dump_defaults" -N -B "$DB_NAME" -e 'SHOW TABLES')"
              if [ -z "$table_list" ]; then
                echo "Database backup could not enumerate tables." >&2
                rm -f "$dump_defaults"
                exit 1
              fi
              mysqldump --defaults-extra-file="$dump_defaults" "$DB_NAME" $table_list > "$backup_dir/tables.sql"
              rm -f "$dump_defaults"
            else
              echo "Database backup could not be created: mysqldump or DB settings are unavailable." >&2
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main
            php -r 'if (function_exists("opcache_reset")) { opcache_reset(); echo "OPcache reset.\n"; }'
            php database/migrations/20260807_finalize_runtime_schema.php
            php database/migrations/20260806_add_admin_archive_markers.php
            php database/migrations/20260806_enforce_course_log_uniqueness.php
            php database/migrations/20260801_create_student_learning_evidence.php
            php database/migrations/20260802_create_recovery_plans.php
            php database/migrations/20260802_create_recovery_plan_coverage.php
            php database/migrations/20260803_create_recovery_plan_templates.php
            php database/migrations/20260804_create_timed_exams.php
            php database/migrations/20260805_add_timed_exam_external_paper.php
            php database/migrations/20260810_timed_exam_drive_only.php
            php database/migrations/20260811_finalize_timed_exam_lifecycle.php
            php database/migrations/20260808_add_course_visibility.php
            php database/migrations/20260809_add_course_state.php
            php database/migrations/20260812_create_password_reset_tokens.php
            php database/migrations/verify_student_learning_evidence.php
            php scripts/finalize-timed-exams.php --dry-run
            php -l index.php
