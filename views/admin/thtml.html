<script>
    
    function fetchTrafficData() {
    $.ajax({
        url: 'requests/analytics/traffic',
        method: 'POST',
        dataType: 'json',
        success: function(data) {
            updateChart(data);
        },
        error: function(error) {
            console.error('Error fetching data:', error);
        }
    });
}

function formatDate(dateString) {
    const options = { day: 'numeric', month: 'short' };
    const date = new Date(dateString);
    return date.toLocaleDateString('ar-EG', options);
}

function updateChart(data) {
    const labels = Object.keys(data).map(date => formatDate(date));
    const values = Object.values(data);

    const ctx = document.getElementById('traffics-chart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Visitor Rate اليومي',
                data: values,
                borderColor: 'rgba(75, 192, 192, 1)',
                borderWidth: 2,
                fill: false,
                backgroundColor: "#2beac787",
                pointStyle: 'rect',
                lineTension: '.15',
                tension: 0.1,
                fill: true,
                pointStyle: "circle",
                pointBorderColor: "#2beac7e0",
                pointBackgroundColor: "#fff",
                pointRadius: 4,
                borderWidth: 3.5,
            }]
        },
        options: {
            // Your other chart options...
        }
    });
}

// Fetch data on page load
fetchTrafficData();

</script>
